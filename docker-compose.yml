# Single container, two processes:
#   - servers.py (SAM3 HTTP API on 127.0.0.1:5050 inside the container)
#   - app.py (Gradio UI on 0.0.0.0:7860 inside the container)
# Both are launched by /app/entrypoint.sh (see Dockerfile ENTRYPOINT/CMD).
#
# Everything is offline-capable except the OUTBOUND call to the Qwen VLM endpoint.
# Override QWEN_BASE_URL etc. in `.env.docker` next to this file.
#
# Quick start:
#   docker compose build       # build the offline image (slow, ~15 min)
#   docker compose up          # foreground; Ctrl+C stops the container
#   docker compose up -d       # background
#   docker compose logs -f     # tail logs
#   docker compose down        # stop & remove the container
#
# Multiple instances side-by-side (different host ports + project name):
#   GRADIO_HOST_PORT=17861 SAM3_HOST_PORT=5051 \
#       docker compose -p sam3-b up -d
# (GPU is shared by default; set CUDA_VISIBLE_DEVICES per instance if you need
# real isolation.)

services:

  sam3:
    image: sam3-cuda:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sam3
    environment:
      SAM3_PORT: "5050"
      SAM3_HOST: "0.0.0.0"
      GRADIO_PORT: "7860"
      # Output dir for /v1/sam3/video. Lives inside the container by default;
      # bind-mount the volume below if you want to keep produced mp4s on the host.
      SAM3_VIDEO_OUT_DIR: "/var/sam3_data"
      # External Qwen 3.6 27B endpoint — override these in .env.docker.
      QWEN_BASE_URL: "${QWEN_BASE_URL:-http://10.0.0.94:5000/v1}"
      QWEN_MODEL: "${QWEN_MODEL:-qwen36-27b-fp8}"
      QWEN_API_KEY: "${QWEN_API_KEY:-no_need}"
    ports:
      - "${GRADIO_HOST_PORT:-17860}:7860"
      - "${SAM3_HOST_PORT:-5050}:5050"
    # volumes:
    #   # Uncomment to persist generated videos on the host:
    #   - ./sam3_out:/var/sam3_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fs http://127.0.0.1:5050/health | grep -q '"sam3_video":true'
          && curl -fs -o /dev/null http://127.0.0.1:7860/
      interval: 30s
      timeout: 5s
      retries: 3
      # SAM3 cold-start (~30-45s) + Gradio (~5s) + buffer.
      start_period: 120s
    restart: unless-stopped
